<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="6-Module Todo App with MySQL Backend">
    <meta name="theme-color" content="#667eea">
    <title>Todo App - 6 Modules</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/modules.css">
</head>
<body>
    <div class="app-container" id="app">
        <!-- Login/Register Page -->
        <div id="authPage" class="page">
            <div class="auth-container">
                <h1>📝 Todo App</h1>
                <p class="subtitle">6 Modules • Offline Capable • MySQL Backend</p>

                <div class="auth-tabs">
                    <button class="tab-btn active" onclick="switchAuthTab('login')">Login</button>
                    <button class="tab-btn" onclick="switchAuthTab('register')">Register</button>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                    <p class="hint">Demo: user@example.com / password123</p>
                </form>

                <!-- Register Form -->
                <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
                    <input type="text" placeholder="First Name" required>
                    <input type="text" placeholder="Last Name">
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit">Register</button>
                </form>
            </div>
        </div>

        <!-- Main App -->
        <div id="mainApp" class="page" style="display:none;">
            <!-- Header -->
            <header class="app-header">
                <div class="header-left">
                    <h1>📝 Todo App</h1>
                </div>
                <div class="header-right">
                    <span class="status-indicator" id="statusIndicator">🟢</span>
                    <div class="user-menu">
                        <button class="user-btn" onclick="toggleUserMenu()">
                            <span id="userName">User</span>
                            <span>▼</span>
                        </button>
                        <div class="dropdown-menu" id="userMenu">
                            <button onclick="navigateTo('settings')">⚙️ Settings</button>
                            <button onclick="handleLogout()">🚪 Logout</button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Sidebar -->
            <aside class="sidebar">
                <nav class="nav-menu">
                    <button class="nav-btn active" data-page="dashboard" onclick="navigateTo('dashboard')">📊 Dashboard</button>
                    <button class="nav-btn" data-page="todos" onclick="navigateTo('todos')">✓ Todos</button>
                    <button class="nav-btn" data-page="notes" onclick="navigateTo('notes')">📋 Notes</button>
                    <button class="nav-btn" data-page="categories" onclick="navigateTo('categories')">📁 Categories</button>
                    <button class="nav-btn" data-page="statistics" onclick="navigateTo('statistics')">📈 Statistics</button>
                    <button class="nav-btn" data-page="settings" onclick="navigateTo('settings')">⚙️ Settings</button>
                </nav>
            </aside>

            <!-- Content Area -->
            <main class="content">
                <!-- Dashboard Module -->
                <section id="dashboard" class="module active">
                    <h2>Dashboard</h2>
                    <div class="dashboard-grid">
                        <div class="stat-card">
                            <div class="stat-value" id="totalTodos">0</div>
                            <div class="stat-label">Total Todos</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="completedTodos">0</div>
                            <div class="stat-label">Completed</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="pendingTodos">0</div>
                            <div class="stat-label">Pending</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="completionRate">0%</div>
                            <div class="stat-label">Completion</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="totalNotes">0</div>
                            <div class="stat-label">Notes</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="totalCategories">0</div>
                            <div class="stat-label">Categories</div>
                        </div>
                    </div>
                </section>

                <!-- Todos Module -->
                <section id="todos" class="module">
                    <div class="module-header">
                        <h2>✓ Todos</h2>
                        <button class="btn-primary" onclick="showAddTodoForm()">+ Add Todo</button>
                    </div>
                    <div id="todoForm" class="form-container" style="display:none;">
                        <form onsubmit="handleAddTodo(event)">
                            <input type="text" id="todoTitle" placeholder="Todo title" required>
                            <textarea id="todoDescription" placeholder="Description (optional)"></textarea>
                            <select id="todoCategory">
                                <option value="">Select Category</option>
                            </select>
                            <select id="todoPriority">
                                <option value="low">Low Priority</option>
                                <option value="medium" selected>Medium Priority</option>
                                <option value="high">High Priority</option>
                            </select>
                            <input type="date" id="todoDueDate">
                            <div class="form-buttons">
                                <button type="submit">Save Todo</button>
                                <button type="button" onclick="hideAddTodoForm()">Cancel</button>
                            </div>
                        </form>
                    </div>
                    <div id="todoList" class="list-container"></div>
                </section>

                <!-- Notes Module -->
                <section id="notes" class="module">
                    <div class="module-header">
                        <h2>📋 Notes</h2>
                        <button class="btn-primary" onclick="showAddNoteForm()">+ Add Note</button>
                    </div>
                    <div id="noteForm" class="form-container" style="display:none;">
                        <form onsubmit="handleAddNote(event)">
                            <input type="text" id="noteTitle" placeholder="Note title" required>
                            <textarea id="noteContent" placeholder="Note content..." required></textarea>
                            <input type="color" id="noteColor" value="#fff59d">
                            <div class="form-buttons">
                                <button type="submit">Save Note</button>
                                <button type="button" onclick="hideAddNoteForm()">Cancel</button>
                            </div>
                        </form>
                    </div>
                    <div id="noteList" class="notes-grid"></div>
                </section>

                <!-- Categories Module -->
                <section id="categories" class="module">
                    <div class="module-header">
                        <h2>📁 Categories</h2>
                        <button class="btn-primary" onclick="showAddCategoryForm()">+ Add Category</button>
                    </div>
                    <div id="categoryForm" class="form-container" style="display:none;">
                        <form onsubmit="handleAddCategory(event)">
                            <input type="text" id="categoryName" placeholder="Category name" required>
                            <input type="color" id="categoryColor" value="#667eea">
                            <div class="form-buttons">
                                <button type="submit">Save Category</button>
                                <button type="button" onclick="hideAddCategoryForm()">Cancel</button>
                            </div>
                        </form>
                    </div>
                    <div id="categoryList" class="list-container"></div>
                </section>

                <!-- Statistics Module -->
                <section id="statistics" class="module">
                    <h2>📈 Statistics</h2>
                    <div class="stats-container">
                        <div class="chart-box">
                            <h3>Priority Breakdown</h3>
                            <div id="priorityChart" class="chart"></div>
                        </div>
                        <div class="chart-box">
                            <h3>Todos by Category</h3>
                            <div id="categoryChart" class="chart"></div>
                        </div>
                    </div>
                </section>

                <!-- Settings Module -->
                <section id="settings" class="module">
                    <h2>⚙️ Settings</h2>
                    <form onsubmit="handleSaveSettings(event)" class="settings-form">
                        <div class="setting-group">
                            <label for="themeSelect">Theme:</label>
                            <select id="themeSelect">
                                <option value="light">Light</option>
                                <option value="dark">Dark</option>
                            </select>
                        </div>
                        <div class="setting-group">
                            <label for="languageSelect">Language:</label>
                            <select id="languageSelect">
                                <option value="en">English</option>
                                <option value="es">Español</option>
                                <option value="fr">Français</option>
                            </select>
                        </div>
                        <div class="setting-group">
                            <label for="timezoneSelect">Timezone:</label>
                            <select id="timezoneSelect">
                                <option value="UTC">UTC</option>
                                <option value="America/New_York">America/New_York</option>
                                <option value="Europe/London">Europe/London</option>
                                <option value="Asia/Tokyo">Asia/Tokyo</option>
                            </select>
                        </div>
                        <div class="setting-group">
                            <label>
                                <input type="checkbox" id="notificationsEnabled">
                                Enable Notifications
                            </label>
                        </div>
                        <button type="submit" class="btn-primary">Save Settings</button>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/modules/auth.js"></script>
    <script src="js/modules/todos.js"></script>
    <script src="js/modules/notes.js"></script>
    <script src="js/modules/categories.js"></script>
    <script src="js/modules/stats.js"></script>
    <script src="js/modules/settings.js"></script>
    <script src="js/offline.js"></script>
</body>
</html>
